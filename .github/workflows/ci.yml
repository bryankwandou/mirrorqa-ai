name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Non-skippable safety guardrail
        run: node --test tests/safety-guardrail.test.mjs
      - run: npm run type-check
      - run: npm run build
      - name: Production route smoke test
        env:
          TEST_BASE_URL: https://mirrorqa-ai.vercel.app
        run: node --test tests/public-routes.test.mjs
